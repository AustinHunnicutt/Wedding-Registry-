<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vanesa and Austin's Registry</title>
<style>
:root{--bg:#f6f2ec;--paper:#fffdfa;--ink:#2b2723;--muted:#746e67;--line:#ded6cc;--accent:#6e5742;--green:#3f6c53;--gold:#8a642d;--red:#8b3c3c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}header{text-align:center;padding:48px 20px 24px}h1,h2,h3{font-family:Georgia,serif;font-weight:500}h1{margin:0;font-size:clamp(38px,7vw,64px)}header p{max-width:760px;margin:14px auto 0;color:var(--muted);line-height:1.55}.wrap{max-width:1100px;margin:auto;padding:0 18px 60px}.bar,.tabs,.actions,.row{display:flex;gap:8px;flex-wrap:wrap}.bar{justify-content:center;margin-bottom:18px}.tabs{overflow-x:auto;margin-bottom:18px}button,.button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:10px 14px;font:inherit;cursor:pointer;text-decoration:none}.primary{background:var(--accent);border-color:var(--accent);color:white}.danger{color:var(--red)}.tabs .active{background:var(--ink);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px}.card{display:flex;flex-direction:column;min-height:250px}.cat{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.card h3{font-size:24px;margin:8px 0}.meta,.connection{color:var(--muted);font-size:14px}.notes{line-height:1.45}.spacer{flex:1}.status{border-top:1px solid var(--line);padding-top:12px;margin-top:10px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green);margin-right:7px}.reserved .dot{background:var(--gold)}.purchased .dot{background:var(--red)}.actions{margin-top:12px}.connection{text-align:center;margin:0 0 18px}.panel{display:none;margin-bottom:18px}body.owner .panel{display:block}.panel h2{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;font:inherit;background:white}textarea{min-height:86px}dialog{border:0;border-radius:18px;padding:0;max-width:480px;width:calc(100% - 28px)}dialog::backdrop{background:#0007}.modal{padding:22px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.owner-actions{display:none}body.owner .owner-actions{display:flex}@media(max-width:650px){.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<header><h1 id="title">Vanesa and Austin's Registry</h1><p id="intro"></p></header>
<div class="wrap">
<div class="bar"><button id="ownerBtn">Owner</button><button id="exitBtn" style="display:none">Exit owner mode</button></div>
<section class="panel"><h2>Registry settings</h2><label>Page title</label><input id="setTitle"><label>Instructions</label><textarea id="setIntro"></textarea><div class="row"><button class="primary" id="saveSettings">Save heading & instructions</button></div></section>
<section class="panel"><h2>Categories</h2><label>New category</label><input id="newCat"><div class="row"><button class="primary" id="addCat">Add category</button></div><div id="catAdmin"></div></section>
<section class="panel" id="giftPanel"><h2 id="giftHeading">Add a gift</h2><div class="form"><div><label>Gift name</label><input id="gName"></div><div><label>Category</label><select id="gCat"></select></div><div><label>Store</label><input id="gStore"></div><div><label>Price</label><input id="gPrice"></div><div class="full"><label>Product / registry link</label><input id="gUrl"></div><div class="full"><label>Notes</label><textarea id="gNotes"></textarea></div></div><div class="row"><button class="primary" id="saveGift">Add gift</button><button id="cancelEdit" style="display:none">Cancel edit</button></div></section>
<div class="connection" id="connection">Loading shared registry…</div><nav class="tabs" id="tabs"></nav><main class="grid" id="grid"></main></div>
<dialog id="claimDlg"><form method="dialog" class="modal"><h2 id="claimTitle"></h2><p id="claimText"></p><label>Your name</label><input id="claimName"><label>What would you like to do?</label><select id="claimStatus"></select><div class="modal-actions"><button value="cancel">Cancel</button><button class="primary" id="claimSave" value="default">Save</button></div></form></dialog>
<dialog id="ownerDlg"><form method="dialog" class="modal"><h2>Owner mode</h2><p>Enter the owner code to edit this registry.</p><label>Owner code</label><input id="ownerCodeInput" type="password"><div class="modal-actions"><button value="cancel">Cancel</button><button class="primary" id="ownerUnlock" value="default">Unlock</button></div></form></dialog>
<script>
const U="https://mmvduohkzgkmsxikitsv.supabase.co",K="sb_publishable_KbZT5IXhtMzg4RXDtO6IXw_VK8gTm95",A=U+"/rest/v1",H={apikey:K,Accept:"application/json"};
let cats=[],gifts=[],active="All",claimId=null,ownerCode="",editId=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function j(r){try{return await r.json()}catch{return null}}async function get(p){const r=await fetch(A+p,{headers:H});if(!r.ok)throw Error((await j(r))?.message||"Load failed");return r.json()}async function rpc(n,b){const r=await fetch(A+"/rpc/"+n,{method:"POST",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify(b)}),x=await j(r);if(!r.ok)throw Error(x?.message||"Request failed");return x}
async function load(){try{const[s,c,g]=await Promise.all([get("/registry_settings?select=title,intro&id=eq.1"),get("/registry_categories?select=name,sort_order&order=sort_order.asc"),get("/registry_gifts?select=id,name,category,store,price,url,notes,status,purchaser,sort_order&order=sort_order.asc")]);if(s[0]){title.textContent=s[0].title;intro.textContent=s[0].intro;document.title=s[0].title;setTitle.value=s[0].title;setIntro.value=s[0].intro}cats=c.map(x=>x.name);gifts=g;if(active!=="All"&&!cats.includes(active))active="All";renderTabs();renderAdminCats();renderCatSelect();render();connection.textContent="Shared list • purchase status updates for everyone"}catch(e){connection.textContent="Could not connect to registry";grid.innerHTML='<div class="card">'+esc(e.message)+'</div>'}}
function renderTabs(){tabs.innerHTML=["All",...cats].map(c=>'<button class="'+(c===active?"active":"")+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join("");tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{active=b.dataset.c;renderTabs();render()})}
function render(){const list=active==="All"?gifts:gifts.filter(g=>g.category===active);grid.innerHTML=list.map(g=>{const st=g.status||"available",txt=st==="available"?"Available":st==="reserved"?"Reserved by <b>"+esc(g.purchaser)+"</b>":"Purchased by <b>"+esc(g.purchaser)+"</b>",mine=localStorage.getItem("registry-claim-"+g.id),act=st==="available"?"Claim / mark purchased":mine?"Change / release my claim":"I made this claim";return '<article class="card '+st+'"><div class="cat">'+esc(g.category||"Uncategorized")+'</div><h3>'+esc(g.name)+'</h3><div class="meta">'+esc(g.store||"")+(g.store&&g.price?" · ":"")+esc(g.price||"")+'</div>'+(g.notes?'<p class="notes">'+esc(g.notes)+'</p>':"")+'<div class="spacer"></div><div class="status"><span class="dot"></span>'+txt+'</div><div class="actions">'+(g.url?'<a class="button primary" target="_blank" rel="noopener" href="'+esc(g.url)+'">Buy / view gift</a>':"")+'<button data-claim="'+g.id+'">'+act+'</button></div><div class="actions owner-actions"><button data-edit="'+g.id+'">Edit</button><button class="danger" data-del="'+g.id+'">Delete</button></div></article>'}).join("");grid.querySelectorAll("[data-claim]").forEach(b=>b.onclick=()=>openClaim(b.dataset.claim));grid.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editGift(b.dataset.edit));grid.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delGift(b.dataset.del))}
function token(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()}function openClaim(id){const g=gifts.find(x=>x.id===id);claimId=id;claimTitle.textContent=g.name;claimName.value="";const mine=localStorage.getItem("registry-claim-"+id);if(g.status==="available"){claimText.textContent="Enter your name, then reserve the gift or mark it purchased.";claimStatus.innerHTML='<option value="reserved">I’m planning to buy this</option><option value="purchased">I bought this</option>'}else{claimText.textContent=mine?"Change the status or release it back to the registry.":"If you made this claim before the update, enter the same name to recover it.";claimName.value=mine?(g.purchaser||""):"";claimStatus.innerHTML=g.status==="reserved"?'<option value="purchased">I bought this</option><option value="available">Release it — make available again</option>':'<option value="reserved">Move it back to reserved</option><option value="available">Release it — make available again</option>'}claimDlg.showModal()}
claimSave.onclick=async e=>{e.preventDefault();const name=claimName.value.trim(),st=claimStatus.value;if(st!=="available"&&!name)return;let t=localStorage.getItem("registry-claim-"+claimId)||token();try{await rpc("manage_registry_gift",{p_gift_id:claimId,p_purchaser:name,p_status:st,p_claim_token:t});if(st==="available")localStorage.removeItem("registry-claim-"+claimId);else localStorage.setItem("registry-claim-"+claimId,t);claimDlg.close();await load()}catch(e){alert(e.message)}};
ownerBtn.onclick=()=>{ownerCodeInput.value="";ownerDlg.showModal()};ownerUnlock.onclick=async e=>{e.preventDefault();try{const ok=await rpc("registry_admin_ok",{p_code:ownerCodeInput.value});if(ok!==true)throw Error();ownerCode=ownerCodeInput.value;sessionStorage.setItem("registryOwner",ownerCode);document.body.classList.add("owner");ownerBtn.style.display="none";exitBtn.style.display="";ownerDlg.close()}catch{alert("Owner code was not accepted.")}};exitBtn.onclick=()=>{ownerCode="";sessionStorage.removeItem("registryOwner");document.body.classList.remove("owner");ownerBtn.style.display="";exitBtn.style.display="none";clearGift()};
saveSettings.onclick=async()=>{try{await rpc("admin_save_registry_settings",{p_code:ownerCode,p_title:setTitle.value,p_intro:setIntro.value});await load();alert("Saved.")}catch(e){alert(e.message)}};addCat.onclick=async()=>{if(!newCat.value.trim())return;try{await rpc("admin_add_registry_category",{p_code:ownerCode,p_name:newCat.value.trim()});newCat.value="";await load()}catch(e){alert(e.message)}};
function renderAdminCats(){catAdmin.innerHTML=cats.map(c=>'<div class="row"><input value="'+esc(c)+'"><button data-ren="'+esc(c)+'">Rename</button><button class="danger" data-dc="'+esc(c)+'">Delete</button></div>').join("");catAdmin.querySelectorAll("[data-ren]").forEach(b=>b.onclick=async()=>{const n=b.parentElement.querySelector("input").value.trim();if(!n)return;try{await rpc("admin_rename_registry_category",{p_code:ownerCode,p_old_name:b.dataset.ren,p_new_name:n});await load()}catch(e){alert(e.message)}});catAdmin.querySelectorAll("[data-dc]").forEach(b=>b.onclick=async()=>{if(!confirm('Delete "'+b.dataset.dc+'"? Gifts will become uncategorized.'))return;try{await rpc("admin_delete_registry_category",{p_code:ownerCode,p_name:b.dataset.dc});await load()}catch(e){alert(e.message)}})}
function renderCatSelect(){const v=gCat.value;gCat.innerHTML='<option value="">Uncategorized</option>'+cats.map(c=>'<option>'+esc(c)+'</option>').join("");gCat.value=v}function editGift(id){const g=gifts.find(x=>x.id===id);editId=id;giftHeading.textContent="Edit gift";saveGift.textContent="Save changes";cancelEdit.style.display="";gName.value=g.name||"";gCat.value=g.category||"";gStore.value=g.store||"";gPrice.value=g.price||"";gUrl.value=g.url||"";gNotes.value=g.notes||"";giftPanel.scrollIntoView({behavior:"smooth"})}function clearGift(){editId=null;giftHeading.textContent="Add a gift";saveGift.textContent="Add gift";cancelEdit.style.display="none";gName.value=gStore.value=gPrice.value=gUrl.value=gNotes.value="";gCat.value=""}cancelEdit.onclick=clearGift;saveGift.onclick=async()=>{if(!gName.value.trim())return alert("Gift name is required.");try{await rpc("admin_save_registry_gift",{p_code:ownerCode,p_id:editId||null,p_name:gName.value,p_category:gCat.value,p_store:gStore.value,p_price:gPrice.value,p_url:gUrl.value,p_notes:gNotes.value});clearGift();await load()}catch(e){alert(e.message)}};async function delGift(id){const g=gifts.find(x=>x.id===id);if(!confirm('Delete "'+g.name+'"?'))return;try{await rpc("admin_delete_registry_gift",{p_code:ownerCode,p_id:id});await load()}catch(e){alert(e.message)}}
(async()=>{await load();const c=sessionStorage.getItem("registryOwner");if(c){try{if(await rpc("registry_admin_ok",{p_code:c})===true){ownerCode=c;document.body.classList.add("owner");ownerBtn.style.display="none";exitBtn.style.display=""}}catch{}}})();setInterval(()=>{if(!claimDlg.open&&!ownerDlg.open)load()},12000);
</script></body></html>
