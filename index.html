<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vanesa and Austin's Registry</title>
<style>
:root{--bg:#f6f2ec;--paper:#fffdfa;--ink:#2b2723;--muted:#746e67;--line:#ded6cc;--accent:#6e5742;--green:#3f6c53;--gold:#8a642d;--red:#8b3c3c;--shadow:0 10px 28px rgba(48,38,28,.07);--radius:18px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{text-align:center;padding:52px 20px 28px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:500}
header h1{margin:0;font-size:clamp(38px,7vw,64px);letter-spacing:-1px}
header p{max-width:720px;margin:14px auto 0;color:var(--muted);line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px 64px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;margin-bottom:10px}
button,.button{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:10px 15px;font:inherit;cursor:pointer;text-decoration:none;transition:.15s ease}
button:hover,.button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
button:disabled{opacity:.55;cursor:not-allowed;transform:none}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button{white-space:nowrap}
.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;min-height:260px}
.category-label{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted);margin-bottom:8px}
.card h3{margin:0 0 6px;font-size:25px}
.meta{color:var(--muted);font-size:14px;margin-bottom:10px}
.notes{line-height:1.48;color:#504a44;margin:2px 0 16px}
.spacer{flex:1}
.status{display:flex;gap:8px;align-items:center;padding-top:14px;border-top:1px solid var(--line);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex:0 0 auto}
.reserved .dot{background:var(--gold)}
.purchased .dot{background:var(--red)}
.purchaser{font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions .button,.actions button{font-size:14px;padding:9px 12px}
.empty,.message{grid-column:1/-1;text-align:center;padding:34px;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius)}
.connection{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px}
dialog{border:0;padding:0;border-radius:20px;max-width:480px;width:calc(100% - 28px);box-shadow:0 24px 80px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(35,30,25,.45)}
.modal{padding:22px}.modal h2{margin:0 0 10px}.modal p{color:var(--muted);line-height:1.45}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input,select{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
footer{text-align:center;color:var(--muted);font-size:13px;line-height:1.55;margin-top:38px}
</style>
</head>
<body>
<header>
  <h1 id="registryTitle">Vanesa and Austin's Registry</h1>
  <p id="registryIntro">Thank you for celebrating with us.</p>
</header>
<div class="wrap">
  <div class="connection" id="connection">Loading shared registry…</div>
  <nav class="tabs" id="categoryTabs"></nav>
  <main class="grid" id="giftGrid"><div class="message">Loading gifts…</div></main>
  <footer>Shared wedding registry • no ads or analytics</footer>
</div>

<dialog id="claimDialog">
  <form method="dialog" class="modal">
    <h2 id="claimTitle">Claim gift</h2>
    <p id="claimText"></p>
    <label for="claimName">Your name</label>
    <input id="claimName" maxlength="80" required placeholder="Your name">
    <label for="claimStatus">What would you like to do?</label>
    <select id="claimStatus"></select>
    <div class="modal-actions">
      <button value="cancel">Cancel</button>
      <button id="confirmClaim" class="primary" value="default">Save</button>
    </div>
  </form>
</dialog>

<script>
const SUPABASE_URL = "https://mmvduohkzgkmsxikitsv.supabase.co";
const SUPABASE_KEY = "sb_publishable_KbZT5IXhtMzg4RXDtO6IXw_VK8gTm95";
const API = SUPABASE_URL + "/rest/v1";
const API_HEADERS = {"apikey":SUPABASE_KEY,"Accept":"application/json"};

let categories=[], gifts=[], activeCategory="All", claimGiftId=null, firstLoad=true;

const esc=(v="")=>String(v).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));

async function safeJson(res){try{return await res.json()}catch{return null}}
async function apiGet(path){
  const res=await fetch(API+path,{headers:API_HEADERS});
  if(!res.ok) throw new Error((await safeJson(res))?.message||"Could not load registry");
  return res.json();
}
async function loadRegistry(showLoading=false){
  if(showLoading) document.getElementById("connection").textContent="Loading shared registry…";
  try{
    const [s,c,g]=await Promise.all([
      apiGet("/registry_settings?select=title,intro&id=eq.1"),
      apiGet("/registry_categories?select=name,sort_order&order=sort_order.asc"),
      apiGet("/registry_gifts?select=id,name,category,store,price,url,notes,status,purchaser,sort_order&order=sort_order.asc")
    ]);
    if(s[0]){
      registryTitle.textContent=s[0].title;
      registryIntro.textContent=s[0].intro;
      document.title=s[0].title;
    }
    categories=c.map(x=>x.name); gifts=g;
    if(activeCategory!=="All"&&!categories.includes(activeCategory)) activeCategory="All";
    renderCategories(); renderGifts();
    connection.textContent="Shared list • purchase status updates for everyone";
    firstLoad=false;
  }catch(err){
    connection.textContent="Could not connect to the shared registry. If you opened this file inside ChatGPT, publish it to GitHub Pages first.";
    if(firstLoad) giftGrid.innerHTML=`<div class="message">${esc(err.message)}<br><br>Run the Supabase setup SQL first.</div>`;
  }
}
function renderCategories(){
  categoryTabs.innerHTML=["All",...categories].map(cat=>`<button class="${cat===activeCategory?"active":""}" data-category="${esc(cat)}">${esc(cat)}</button>`).join("");
  categoryTabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{activeCategory=b.dataset.category;renderCategories();renderGifts()});
}
function renderGifts(){
  const visible=activeCategory==="All"?gifts:gifts.filter(g=>g.category===activeCategory);
  if(!visible.length){giftGrid.innerHTML='<div class="empty">No gifts in this category.</div>';return}
  giftGrid.innerHTML=visible.map(g=>{
    const st=g.status||"available";
    const stText=st==="available"?"Available":st==="reserved"?`Reserved by <span class="purchaser">${esc(g.purchaser)}</span>`:`Purchased by <span class="purchaser">${esc(g.purchaser)}</span>`;
    const hasLocalClaim = !!localStorage.getItem("registry-claim-" + g.id);
    const action = st==="available"
      ? `<button data-claim="${g.id}">Claim / mark purchased</button>`
      : hasLocalClaim
        ? `<button data-claim="${g.id}">Change / release my claim</button>`
        : `<button data-claim="${g.id}">I made this claim</button>`;
    return `<article class="card ${st}">
      <div class="category-label">${esc(g.category||"Uncategorized")}</div>
      <h3>${esc(g.name)}</h3>
      <div class="meta">${g.store?esc(g.store):""}${g.store&&g.price?" · ":""}${g.price?esc(g.price):""}</div>
      ${g.notes?`<p class="notes">${esc(g.notes)}</p>`:""}
      <div class="spacer"></div>
      <div class="status"><span class="dot"></span><span>${stText}</span></div>
      <div class="actions">
        ${g.url?`<a class="button primary" href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">Buy / view gift</a>`:""}
        ${action}
      </div>
    </article>`;
  }).join("");
  giftGrid.querySelectorAll("[data-claim]").forEach(b=>b.onclick=()=>openClaim(b.dataset.claim));
}
function makeClaimToken(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const bytes=new Uint8Array(24);
  crypto.getRandomValues(bytes);
  return Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("");
}
function claimStorageKey(id){return "registry-claim-"+id}
function openClaim(id){
  const g=gifts.find(x=>x.id===id); if(!g) return;
  claimGiftId=id;
  claimTitle.textContent=g.name;
  claimName.value="";
  claimStatus.disabled=false;
  claimStatus.innerHTML="";

  const localToken=localStorage.getItem(claimStorageKey(id));

  if(g.status==="available"){
    claimText.textContent="Enter your name, then reserve the gift or mark it purchased.";
    claimStatus.innerHTML=`
      <option value="reserved">I'm planning to buy this</option>
      <option value="purchased">I bought this</option>`;
  } else if(localToken){
    claimText.textContent=`This is currently ${g.status} by ${g.purchaser}. You can change the status or release it back to the registry.`;
    if(g.status==="reserved"){
      claimStatus.innerHTML=`
        <option value="purchased">I bought this</option>
        <option value="available">Release it — make available again</option>`;
    }else{
      claimStatus.innerHTML=`
        <option value="reserved">Move it back to reserved</option>
        <option value="available">Release it — make available again</option>`;
    }
    claimName.value=g.purchaser||"";
  } else {
    claimText.textContent=`This is currently ${g.status} by ${g.purchaser}. If you made this claim before the update, enter the same name to recover it.`;
    if(g.status==="reserved"){
      claimStatus.innerHTML=`
        <option value="purchased">I bought this</option>
        <option value="available">Release it — make available again</option>`;
    }else{
      claimStatus.innerHTML=`
        <option value="reserved">Move it back to reserved</option>
        <option value="available">Release it — make available again</option>`;
    }
  }
  claimDialog.showModal();
}
confirmClaim.addEventListener("click",async e=>{
  e.preventDefault();
  const name=claimName.value.trim(), status=claimStatus.value;
  if(status!=="available" && !name) return;
  const gift=gifts.find(x=>x.id===claimGiftId);
  let token=localStorage.getItem(claimStorageKey(claimGiftId)) || "";
  const wasAvailable = gift && gift.status==="available";
  if(wasAvailable && !token) token=makeClaimToken();
  if(!wasAvailable && !token) token=makeClaimToken();

  confirmClaim.disabled=true; confirmClaim.textContent="Saving…";
  try{
    const res=await fetch(API+"/rpc/manage_registry_gift",{
      method:"POST",
      headers:{...API_HEADERS,"Content-Type":"application/json"},
      body:JSON.stringify({
        p_gift_id:claimGiftId,
        p_purchaser:name,
        p_status:status,
        p_claim_token:token
      })
    });
    if(!res.ok){const info=await safeJson(res);throw new Error(info?.message||"Could not save your selection")}

    if(status==="available"){
      localStorage.removeItem(claimStorageKey(claimGiftId));
    }else{
      localStorage.setItem(claimStorageKey(claimGiftId),token);
    }

    claimDialog.close(); await loadRegistry(false);
  }catch(err){alert(err.message);await loadRegistry(false)}
  finally{confirmClaim.disabled=false;confirmClaim.textContent="Save"}
});
loadRegistry(true);
setInterval(()=>{if(!claimDialog.open) loadRegistry(false)},12000);
</script>
</body>
</html>
